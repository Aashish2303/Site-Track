name: SiteTrack security and application checks

on:
  push:
    branches: [main]
    paths:
      - 'resources/views/user/**'
      - 'resources/views/errors/**'
      - 'app/**'
      - 'routes/**'
      - 'config/**'
      - 'database/migrations/workflows/**'
      - 'database.sql'
      - 'tests/**'
      - 'composer.*'
      - 'public/assets/admin/css/**'
      - 'public/assets/admin/js/**'
      - 'public/assets/admin/fonts/**'
      - 'public/assets/admin/uploads/**'
      - 'public/.htaccess'
      - 'deploy/**'
      - 'scripts/*-ui.sh'
      - '.github/workflows/sitetrack-ui.yml'
  pull_request:
    paths:
      - 'resources/views/user/**'
      - 'resources/views/errors/**'
      - 'app/**'
      - 'routes/**'
      - 'config/**'
      - 'database/migrations/workflows/**'
      - 'database.sql'
      - 'tests/**'
      - 'composer.*'
      - 'public/assets/admin/css/**'
      - 'public/assets/admin/js/**'
      - 'public/assets/admin/fonts/**'
      - 'public/assets/admin/uploads/**'
      - 'public/.htaccess'
      - 'deploy/**'
      - 'scripts/*-ui.sh'
      - '.github/workflows/sitetrack-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitetrack-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sitetrack_ci
      DB_USERNAME: sitetrack_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, gd, zip, bcmath, curl, xml
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Start isolated database with generated credentials
        run: |
          task_ci_password="$(openssl rand -hex 32)"
          task_ci_root_password="$(openssl rand -hex 32)"
          echo "::add-mask::$task_ci_password"
          echo "::add-mask::$task_ci_root_password"
          echo "DB_PASSWORD=$task_ci_password" >> "$GITHUB_ENV"
          docker run --detach --rm --name sitetrack-ci-mariadb --publish 127.0.0.1:3306:3306 --env MARIADB_DATABASE=sitetrack_ci --env MARIADB_USER=sitetrack_ci --env MARIADB_PASSWORD="$task_ci_password" --env MARIADB_ROOT_PASSWORD="$task_ci_root_password" mariadb:11.8
          for attempt in $(seq 1 60); do
            if docker exec sitetrack-ci-mariadb healthcheck.sh --connect --innodb_initialized; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated CI database
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          docker exec -i -e MYSQL_PWD="$DB_PASSWORD" sitetrack-ci-mariadb mariadb --user=sitetrack_ci sitetrack_ci < database.sql
          php artisan migrate --path=database/migrations/workflows --force
      - name: Test Laravel and build assets
        run: |
          php artisan test --cache-directory="$RUNNER_TEMP/phpunit-cache"
          npm install --package-lock=false --no-audit --no-fund
          npm run build
          node --check public/assets/admin/js/sitetrack-core.js
          node --check public/assets/admin/js/sitetrack-workspace.js
          node --check public/assets/admin/js/sitetrack-ui.js
          node --check public/assets/admin/js/sitetrack-reset.js
          node --check public/assets/admin/js/sitetrack-events.js
          bash -n scripts/package-ui.sh scripts/deploy-ui.sh
          bash scripts/package-ui.sh "$RUNNER_TEMP/sitetrack-ui-check"
          cd "$RUNNER_TEMP/sitetrack-ui-check"
          sha256sum --check SHA256SUMS

      - name: Remove isolated database
        if: ${{ always() }}
        run: docker rm --force sitetrack-ci-mariadb || true
